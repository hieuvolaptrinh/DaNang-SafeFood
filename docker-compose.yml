version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_DB: danang_safe_food
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
