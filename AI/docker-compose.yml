services:
  ai-log:
    build:
      context: .
      dockerfile: Dockerfile
    image: safefood-ai-log:latest
    container_name: safefood-ai-log
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Ngưỡng tin cậy: probability >= threshold => phiên đăng nhập an toàn.
      PREDICT_THRESHOLD: "0.6"
      MODEL_PATH: "mode_log.joblib"
