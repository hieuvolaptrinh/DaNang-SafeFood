user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS resolver cho Docker
    resolver 127.0.0.11 ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # GZIP
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # Rate limit
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Websocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker service backend
    upstream backend {
        server backend:8080;
    }

    # ===================================
    # DEFAULT SERVER
    # ===================================
    server {
        listen 80 default_server;
        server_name _;

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 404;
        }
    }

    # ===================================
    # HTTP -> HTTPS
    # ===================================
    server {
        listen 80;
        listen [::]:80;

        server_name safe-food.vndtech.vn;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===================================
    # HTTPS SERVER
    # ===================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name safe-food.vndtech.vn;

        # SSL Certificates từ Certbot
        ssl_certificate /etc/letsencrypt/live/safe-food.vndtech.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/safe-food.vndtech.vn/privkey.pem;

        # SSL Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend;
            
            # Websocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Rate limit
            limit_req zone=api_limit burst=20 nodelay;
        }
    }

}