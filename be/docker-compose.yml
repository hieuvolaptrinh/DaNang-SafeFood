version: "3.8"

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safefood-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    ports:
      - "8080:8080"
    expose:
      - "8080"
    networks:
      - safefood-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Redis Service
  redis:
    image: redis:alpine
    container_name: safefood-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - safefood-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: safefood-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    networks:
      - safefood-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nginx-logs:
    driver: local

networks:
  safefood-network:
    driver: bridge
