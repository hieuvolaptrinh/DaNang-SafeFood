spring:
  application:
    name: danang-safefood-backend

  datasource:
    url: jdbc:postgresql://postgres:5432/danang_safefood
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080